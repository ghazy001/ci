name: Snyk Report Only + Dashboard Monitor

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk-open-source:
    name: Snyk dependency report and dashboard monitor
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Check Snyk version
        run: snyk --version

      # REPORT ONLY: these steps show results in GitHub Actions and create SARIF files.
      # They do not block/fail the pipeline because of "|| true".
      - name: Snyk report for backend dependencies
        working-directory: backend
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high \
            --sarif-file-output=../snyk-backend.sarif \
          || true

      - name: Snyk report for frontend dependencies
        working-directory: frontend
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high \
            --sarif-file-output=../snyk-frontend.sarif \
          || true

      - name: Snyk report for ai-service Python dependencies
        working-directory: ai-service
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --severity-threshold=high \
            --sarif-file-output=../snyk-ai-service.sarif \
          || true

      # GitHub Security tab upload. These are still report-only.
      - name: Upload backend Snyk SARIF to GitHub Security
        if: ${{ always() && hashFiles('snyk-backend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-backend.sarif
          category: snyk-backend

      - name: Upload frontend Snyk SARIF to GitHub Security
        if: ${{ always() && hashFiles('snyk-frontend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-frontend.sarif
          category: snyk-frontend

      - name: Upload ai-service Snyk SARIF to GitHub Security
        if: ${{ always() && hashFiles('snyk-ai-service.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-ai-service.sarif
          category: snyk-ai-service

      # DASHBOARD: monitor only main branch snapshots, not every pull request.
      # This sends the project snapshot to your Snyk dashboard.
      - name: Send backend snapshot to Snyk dashboard
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        working-directory: backend
        run: |
          snyk monitor \
            --file=package-lock.json \
            --package-manager=npm \
            --project-name="${{ github.repository }}:backend" \
            --target-reference="main" \
          || true

      - name: Send frontend snapshot to Snyk dashboard
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        working-directory: frontend
        run: |
          snyk monitor \
            --file=package-lock.json \
            --package-manager=npm \
            --project-name="${{ github.repository }}:frontend" \
            --target-reference="main" \
          || true

      - name: Send ai-service snapshot to Snyk dashboard
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        working-directory: ai-service
        run: |
          snyk monitor \
            --file=requirements.txt \
            --package-manager=pip \
            --project-name="${{ github.repository }}:ai-service" \
            --target-reference="main" \
          || true
