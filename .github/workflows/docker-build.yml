name: Docker Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  docker-build:
    name: Build and scan Docker images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: qa-platform-${{ matrix.name }}:ci

      - name: Scan ${{ matrix.name }} image with Trivy
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qa-platform-${{ matrix.name }}:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}-image.sarif
          exit-code: 1

      - name: Upload Trivy image result to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}-image.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Fail if Trivy found high or critical image issues
        if: steps.trivy_image.outcome == 'failure'
        run: exit 1

