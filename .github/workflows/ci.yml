name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: testflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d testflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/testflow_test?schema=public
      JWT_ACCESS_SECRET: test_access_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_TIMEOUT_MS: 120000
      OPENAI_API_KEY: test
      ANALYTICS_OPENAI_MODEL: gpt-4.1-mini
      LIVE_EXECUTION_MODE: local
      DEFAULT_SCHEDULER_TIMEZONE: Africa/Tunis

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_DEFAULT_TARGET_URL: http://host.docker.internal:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ai-service:
    name: AI service - lint, test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    defaults:
      run:
        working-directory: ai-service

    env:
      APP_ENV: test
      LLM_PROVIDER: fake
      LLM_FALLBACK_PROVIDER: fake
      SCRIPT_LLM_PROVIDER: fake
      SCRIPT_LLM_FALLBACK_PROVIDER: fake
      OPENAI_API_KEY: test
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: project_knowledge_test
      REDIS_URL: redis://localhost:6379
      CELERY_BROKER_URL: redis://localhost:6379
      CELERY_RESULT_BACKEND: redis://localhost:6379
      PAGE_INSPECTION_ALLOW_PRIVATE_URLS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-cov

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Test
        run: pytest
  sonarqube:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - ai-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: testflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d testflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate backend coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/testflow_test?schema=public
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:3000
          AI_SERVICE_URL: http://127.0.0.1:8001
          AI_SERVICE_TIMEOUT_MS: 120000
          OPENAI_API_KEY: test
          ANALYTICS_OPENAI_MODEL: gpt-4.1-mini
          LIVE_EXECUTION_MODE: local
          DEFAULT_SCHEDULER_TIMEZONE: Africa/Tunis
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run test:cov

      - name: Generate frontend coverage
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_DEFAULT_TARGET_URL: http://host.docker.internal:3000
        run: |
          npm ci
          npm test -- --coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate AI service coverage
        working-directory: ai-service
        env:
          APP_ENV: test
          LLM_PROVIDER: fake
          LLM_FALLBACK_PROVIDER: fake
          SCRIPT_LLM_PROVIDER: fake
          SCRIPT_LLM_FALLBACK_PROVIDER: fake
          OPENAI_API_KEY: test
          OPENAI_MODEL: gpt-4.1-mini
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: project_knowledge_test
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
          PAGE_INSPECTION_ALLOW_PRIVATE_URLS: "true"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
          pytest

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}